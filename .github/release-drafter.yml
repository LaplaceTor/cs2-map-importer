name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
  default: patch
autolabeler:
  - label: 'feature'
    title: '/^feat(\(.*\))?:/i'
    branch: '/feature/.+/'
  - label: 'fix'
    title: '/^fix(\(.*\))?:/i'
    branch: '/fix/.+/'
  - label: 'chore'
    title: '/^chore(\(.*\))?:/i'
template: |
  $CHANGES
