name: Build CMake CI

on:
  push:
    branches-ignore:
      - main
      - python
    paths-ignore: 
        - '*.md'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtshadertools'

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Configure CMake
      run: cmake -B build -S . -DAPP_VERSION=2.0.0-${{ steps.vars.outputs.sha_short }} -DCS2IMPORTER_BUILD_TESTS=OFF

    - name: Build with CMake
      run: cmake --build build --config Release --target cs2importer

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '24'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build BSPSRC Native CLI with GraalVM
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc-temp -Force
        $jarFile = (Get-ChildItem -Path bspsrc-temp -Filter "bspsrc.jar" -Recurse | Select-Object -First 1).FullName

        $nativeArgs = @(
            "-cp", $jarFile,
            "-o", "bspsrc",
            "-O2",
            "-Djava.awt.headless=true",
            "--no-fallback",
            "info.ata4.bspsrc.app.src.cli.BspSourceCli"
        )
        & native-image @nativeArgs
        if ($LASTEXITCODE -ne 0) { throw "native-image failed with exit code $LASTEXITCODE" }

        choco install upx --no-progress
        upx --best --lzma bspsrc.exe
        Move-Item bspsrc.exe bin/bspsrc.exe -Force

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix "$PWD/release"
        if (Test-Path bin) { Copy-Item -Path bin -Destination release\bin -Recurse -Force }
        $zipName = "cs2importer-v2.0.0-${{ steps.vars.outputs.sha_short }}.zip"
        Push-Location release
        7z a $zipName * '-xr!*.zip'
        $zipItem = Get-Item $zipName
        Write-Host "Created archive: $($zipItem.FullName) ($($zipItem.Length) bytes)"
        if ($zipItem.Length -le 1024) { throw "Archive $zipName is suspiciously small ($($zipItem.Length) bytes)" }
        Pop-Location

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Importer-Dev-${{ steps.vars.outputs.sha_short }}
        path: release

    - name: Clean Old Release Assets
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = "Continue"
        $releaseJson = gh release view dev --json assets 2>$null
        if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            $assets = ($releaseJson | ConvertFrom-Json).assets
            foreach ($asset in $assets) {
                if ($asset.name -like "*.zip") {
                    Write-Host "Deleting old asset: $($asset.name)"
                    gh release delete-asset dev $asset.name -y
                }
            }
        }
        $global:LASTEXITCODE = 0

    - name: Generate DEV Release Notes
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        CURRENT_SHA: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
        TRIGGERED_BY: ${{ github.actor }}
        APP_VERSION: 2.0.0-${{ steps.vars.outputs.sha_short }}
      run: |
        $ErrorActionPreference = "Continue"
        $prevSha = $null
        $releaseJson = gh release view dev --json targetCommitish 2>$null
        if ($LASTEXITCODE -eq 0 -and $releaseJson) {
            try {
                $prevSha = ($releaseJson | ConvertFrom-Json).targetCommitish
            } catch {
                $prevSha = $null
            }
        }
        $global:LASTEXITCODE = 0

        $commits = @()
        $isFallback = $false
        $repoUrl = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"

        if ($prevSha) {
            git cat-file -e "${prevSha}^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) {
                if ($prevSha -eq $env:CURRENT_SHA) {
                    $commits = @("* 无新提交（重跑构建）")
                } else {
                    $rawLogs = git log "$($prevSha)..HEAD" --no-merges --pretty=format:"%H|%s"
                    if ($rawLogs) {
                        foreach ($line in ($rawLogs -split "`r?`n")) {
                            if ($line.Trim()) {
                                $parts = $line.Split('|', 2)
                                $sha = $parts[0]
                                $shortSha = $sha.Substring(0, [Math]::Min(7, $sha.Length))
                                $subject = $parts[1]
                                $commits += "- $subject ([$shortSha]($repoUrl/commit/$sha))"
                            }
                        }
                    }
                    if ($commits.Count -eq 0) {
                        $commits = @("* 自上次构建以来无新提交")
                    }
                }
            } else {
                $isFallback = $true
            }
        } else {
            $isFallback = $true
        }

        if ($isFallback) {
            $rawLogs = git log -n 10 --no-merges --pretty=format:"%H|%s"
            if ($rawLogs) {
                foreach ($line in ($rawLogs -split "`r?`n")) {
                    if ($line.Trim()) {
                        $parts = $line.Split('|', 2)
                        $sha = $parts[0]
                        $shortSha = $sha.Substring(0, [Math]::Min(7, $sha.Length))
                        $subject = $parts[1]
                        $commits += "- $subject ([$shortSha]($repoUrl/commit/$sha))"
                    }
                }
            }
        }
        $global:LASTEXITCODE = 0

        $commitSectionHeader = if ($isFallback) {
            "### Last 10 commits"
        } else {
            "### Changes since last build"
        }

        $shortCurrent = $env:CURRENT_SHA.Substring(0, [Math]::Min(7, $env:CURRENT_SHA.Length))
        $bodyLines = @(
            "### CS2 Map Importer - Development Build (DEV) - Don't download this if you're not interested in contribute on code"
            "Build ``$($env:APP_VERSION)`` | [$shortCurrent]($repoUrl/commit/$($env:CURRENT_SHA)) | Branch ``$($env:BRANCH_NAME)`` | Triggered by @$($env:TRIGGERED_BY)"
            ""
            $commitSectionHeader
        )
        $bodyLines += $commits
        $bodyContent = $bodyLines -join "`n"

        Set-Content -Path "dev_release_body.md" -Value $bodyContent -Encoding utf8
        $global:LASTEXITCODE = 0

    - name: Publish Dev Pre-Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dev
        target_commitish: ${{ github.sha }}
        name: DEV
        prerelease: true
        make_latest: false
        files: release/cs2importer-v2.0.0-${{ steps.vars.outputs.sha_short }}.zip
        body_path: dev_release_body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

