name: Build CMake CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
      - cmake-qt
      - python

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -S .

    - name: Restore NuGet Packages
      run: nuget restore build\cs2importer.sln

    - name: Build with MSBuild
      run: msbuild build\cs2importer.sln /p:Configuration=Release /p:Platform=x64 -restore

    - name: Download bspsrc
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        mkdir release
        # Copy the executable and all WinUI3/WindowsAppSDK DLLs and resources recursively
        Copy-Item -Path build\Release\* -Destination release\ -Recurse -Force
        Copy-Item bspsrc\bspsrc.jar release\

        Copy-Item -Path bin -Destination release\bin -Recurse -Force
        cd release
        7z a cs2importer.zip *

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Importer-Dev-${{ steps.vars.outputs.sha_short }}
        path: release/cs2importer.zip
