name: Build CMake CI

on:
  push:
    branches-ignore:
      - main
      - python
    paths-ignore: 
        - '*.md'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtshadertools'

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Configure CMake
      run: cmake -B build -S . -DAPP_VERSION=${{ steps.vars.outputs.sha_short }}

    - name: Build with CMake
      run: cmake --build build --config Release

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '24'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build BSPSRC Native CLI with GraalVM
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc-temp -Force
        $jarFile = (Get-ChildItem -Path bspsrc-temp -Filter "bspsrc.jar" -Recurse | Select-Object -First 1).FullName

        $nativeArgs = @(
            "-cp", $jarFile,
            "-o", "bspsrc",
            "-O2",
            "-Djava.awt.headless=true",
            "--no-fallback",
            "info.ata4.bspsrc.app.src.cli.BspSourceCli"
        )
        & native-image @nativeArgs
        if ($LASTEXITCODE -ne 0) { throw "native-image failed with exit code $LASTEXITCODE" }

        choco install upx --no-progress
        upx --best --lzma bspsrc.exe
        Move-Item bspsrc.exe bin/bspsrc.exe -Force

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix "$PWD/release"
        if (Test-Path bin) { Copy-Item -Path bin -Destination release\bin -Recurse -Force }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Importer-Dev-${{ steps.vars.outputs.sha_short }}
        path: release

