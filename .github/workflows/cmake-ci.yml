name: Build CMake CI

on:
  push:
    branches-ignore:
      - main
      - cmake-qt
      - python

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Latest Qt 6.8.x
      run: |
        python -m aqt install-qt linux desktop "~6.8" linux_gcc_64 --outputdir ${{ github.workspace }}/Qt

    - name: Setup Dynamic Environment Variables
      run: |
        QT_PATH=$(ls -d ${{ github.workspace }}/Qt/6.8.*/gcc_64)
        echo "Qt6_DIR=$QT_PATH/lib/cmake/Qt6" >> $GITHUB_ENV
        echo "$QT_PATH/bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build with CMake
      run: cmake --build build --config Release

    - name: Download bspsrc
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        mkdir release
        Copy-Item build\Release\cs2importer.exe release\
        Copy-Item bspsrc\bspsrc.jar release\
        windeployqt --qmldir src/qml release\cs2importer.exe

        Remove-Item -Path release\translations -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path release\iconengines -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path release\imageformats -Recurse -Force -ErrorAction SilentlyContinue

        Copy-Item -Path bin -Destination release\bin -Recurse
        cd release
        7z a cs2importer.zip *

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2-Importer-Dev-${{ steps.vars.outputs.sha_short }}
        path: release/cs2importer.zip
