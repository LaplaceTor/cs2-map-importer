name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile src/cs2importer.py

    - name: Prepare Release Artifacts
      run: |
        mkdir release
        move dist\cs2importer.exe release\
        cd release
        7z a cs2importer.zip cs2importer.exe

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-${{ steps.vars.outputs.sha_short }}
        name: CS2 Importer Release ${{ steps.vars.outputs.sha_short }}
        files: release/cs2importer.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
