name: Build WinUI 3 Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore CS2Importer.slnx

    - name: Build and Publish
      run: dotnet publish src/CS2Importer/CS2Importer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:WindowsAppSDKSelfContained=true

    - name: Download bspsrc
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc

    - name: Prepare Release Artifacts
      shell: pwsh
      run: |
        mkdir release
        Copy-Item -Path "src\CS2Importer\bin\Release\net8.0-windows10.0.19041.0\win-x64\publish\*" -Destination release -Recurse
        Copy-Item -Path "bspsrc\bspsrc.jar" -Destination release
        if (Test-Path bin) { Copy-Item -Path bin -Destination release\bin -Recurse }
        cd release
        7z a cs2importer.zip *

    - name: Get commit SHA
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: release-${{ steps.vars.outputs.sha_short }}
        name: CS2 Importer Dev ${{ steps.vars.outputs.sha_short }}
        files: release/cs2importer.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
