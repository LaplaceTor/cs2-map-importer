name: Build CMake Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtshadertools'

    - name: Draft Release
      id: release_drafter
      uses: release-drafter/release-drafter@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update CMakeLists.txt Version
      shell: pwsh
      run: |
        $newVersion = "${{ steps.release_drafter.outputs.resolved_version }}"
        (Get-Content CMakeLists.txt) -replace 'project\(cs2importer VERSION .* LANGUAGES CXX\)', "project(cs2importer VERSION $newVersion LANGUAGES CXX)" | Set-Content CMakeLists.txt

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build with CMake
      run: cmake --build build --config Release

    - name: Prepare Release Artifacts
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix "$PWD/release"
        if (Test-Path bin) { Copy-Item -Path bin -Destination release\bin -Recurse -Force }
        cd release
        7z a cs2importer.zip *

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_drafter.outputs.tag_name }}
        name: ${{ steps.release_drafter.outputs.name }}
        body: ${{ steps.release_drafter.outputs.body }}
        files: release/cs2importer.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
