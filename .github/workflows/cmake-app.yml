name: Build CMake Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtshadertools'

    - name: Draft Release
      id: release_drafter
      uses: release-drafter/release-drafter@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update CMakeLists.txt Version
      shell: pwsh
      run: |
        $newVersion = "${{ steps.release_drafter.outputs.resolved_version }}"
        (Get-Content CMakeLists.txt) -replace 'project\(cs2importer VERSION .* LANGUAGES CXX\)', "project(cs2importer VERSION $newVersion LANGUAGES CXX)" | Set-Content CMakeLists.txt

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build with CMake
      run: cmake --build build --config Release

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 24
        distribution: 'oracle'

    - name: Build custom JRE using jlink
      shell: pwsh
      run: |
        jlink `
          --add-modules java.base,java.desktop,java.logging,java.xml,java.management,java.naming,java.scripting `
          --strip-debug `
          --no-man-pages `
          --no-header-files `
          --compress=2 `
          --output jre
        if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Copy-Item -Path jre/* -Destination bin -Recurse -Force

    - name: Download bspsrc
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/ata4/bspsrc/releases/latest/download/bspsrc-jar-only.zip" -OutFile "bspsrc.zip"
        Expand-Archive -Path bspsrc.zip -DestinationPath bspsrc-temp -Force
        if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Get-ChildItem -Path bspsrc-temp -Filter "bspsrc.jar" -Recurse | Copy-Item -Destination bin -Force

    - name: Download VTFEdit
      shell: pwsh
      run: |
        $client = [System.Net.Http.HttpClient]::new()
        $response = $client.GetAsync("https://github.com/Sky-rym/VTFEdit-Reloaded/releases/latest").Result
        $finalUrl = $response.RequestMessage.RequestUri.AbsoluteUri
        $version = $finalUrl.Substring($finalUrl.LastIndexOf('/') + 1)
        $vtfeditUrl = "https://github.com/Sky-rym/VTFEdit-Reloaded/releases/download/$version/VTFEdit_Reloaded_v$version.zip"
        try {
            Invoke-WebRequest -Uri $vtfeditUrl -OutFile "vtfedit_reloaded.zip" -ErrorAction Stop
        } catch {
            $vtfeditUrl = "https://github.com/Sky-rym/VTFEdit-Reloaded/releases/download/$version/VTFEdit_Reloaded_$version.zip"
            Invoke-WebRequest -Uri $vtfeditUrl -OutFile "vtfedit_reloaded.zip"
        }
        Expand-Archive -Path vtfedit_reloaded.zip -DestinationPath vtfedit-temp -Force
        if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Get-ChildItem -Path vtfedit-temp -Filter "Devil.dll" -Recurse | Copy-Item -Destination bin -Force
        Get-ChildItem -Path vtfedit-temp -Filter "vtfcmd.exe" -Recurse | Copy-Item -Destination bin -Force
        Get-ChildItem -Path vtfedit-temp -Filter "vtflib.dll" -Recurse | Copy-Item -Destination bin -Force

    - name: Download vpkeditcli
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/craftablescience/VPKEdit/releases/latest/download/VPKEdit-Windows-Standalone-Compatibility-msvc-Release.zip" -OutFile "vpkedit.zip"
        Expand-Archive -Path vpkedit.zip -DestinationPath vpkedit
        Copy-Item vpkedit\vpkeditcli.exe bin\

    - name: Prepare Release Artifacts
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix "$PWD/release"
        if (Test-Path bin) { Copy-Item -Path bin -Destination release\bin -Recurse -Force }
        cd release
        7z a cs2importer.zip *

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_drafter.outputs.tag_name }}
        name: ${{ steps.release_drafter.outputs.name }}
        body: ${{ steps.release_drafter.outputs.body }}
        files: release/cs2importer.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
